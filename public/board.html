<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>과학 대시 · 전자칠판</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#03050f;overflow:hidden;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%}
.hidden{display:none!important}
#digits{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:flex-end}
#digits img{display:block;margin:0 -6px}
#digits .word{font-family:'Black Han Sans',sans-serif;font-style:italic;color:#5fffd7;line-height:1;margin-right:26px;text-shadow:0 0 18px rgba(63,245,200,.5);transform:skewX(-8deg)}
#fill{position:absolute;left:136px;top:551px;height:57px;width:0;transition:width .8s ease;overflow:visible}
#fill img.bar{width:100%;height:100%;display:block;object-fit:fill}
#streak{position:absolute;right:-60px;top:-30px;width:150px}
#count{position:absolute;left:50%;top:300px;height:400px;transform:translateX(-50%);filter:hue-rotate(160deg) saturate(2.4) brightness(1.15) drop-shadow(0 0 30px #ff3fa4)}
#count.pop{animation:pop .5s}
@keyframes pop{0%{transform:translateX(-50%) scale(1.5);opacity:.2}100%{transform:translateX(-50%) scale(1);opacity:1}}
#celebrate{position:absolute;inset:0;width:100%;height:100%;animation:twinkle 1.2s infinite alternate}
@keyframes twinkle{from{opacity:.55}to{opacity:1}}
#url{position:absolute;right:24px;top:14px;font:22px 'Black Han Sans',sans-serif;color:#eafffa;background:rgba(5,8,30,.75);border:2px solid #5fffd7;border-radius:12px;padding:6px 14px}
#online{position:absolute;left:24px;top:14px;font:22px 'Black Han Sans',sans-serif;color:#eafffa;background:rgba(5,8,30,.75);border:2px solid #ff4fb0;border-radius:12px;padding:6px 14px}
#joinFix{position:absolute;left:882px;top:418px;width:546px;height:80px;background:#080a29;display:flex;align-items:center;justify-content:center;font:56px 'Black Han Sans',sans-serif;color:#fff;text-shadow:3px 3px 0 #000}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font:18px sans-serif;color:#cfeee6;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:10px;transition:opacity 1s}
#err{position:absolute;left:0;right:0;bottom:30px;text-align:center;font:24px 'Black Han Sans',sans-serif;color:#ffb3bd}
</style>
</head>
<body>
<div id="stage">
  <img id="bg" alt="">
  <img id="count" class="hidden" alt="">
  <div id="fill" class="hidden"><img class="bar" src="assets/board_fill.webp" alt=""><img id="streak" src="assets/board_streak.webp" alt=""></div>
  <div id="digits"></div>
  <img id="celebrate" class="hidden" src="assets/board_celebrate.webp" alt="">
  <div id="joinFix" class="hidden">2. 반과 번호 고르기</div>
  <div id="url" class="hidden"></div>
  <div id="online" class="hidden"></div>
  <div id="err" class="hidden">서버에 연결하는 중…</div>
</div>
<div id="hint">화면을 누르면 전체 화면이 돼요</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const cls = new URLSearchParams(location.search).get('cls') || '1';
document.title = `과학 대시 · 3-${cls}반 전자칠판`;
function fit() { const s = Math.min(innerWidth / 1600, innerHeight / 900); $('stage').style.transform = `translate(${(innerWidth - 1600 * s) / 2}px,${(innerHeight - 900 * s) / 2}px) scale(${s})`; }
addEventListener('resize', fit); fit();
document.body.onclick = () => { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) { } };
setTimeout(() => $('hint').style.opacity = 0, 5000);
const base = location.pathname.replace(/board(\.html)?$/, '');
$('url').textContent = '학생 주소 · ' + location.host + base;

let B = null, countEnd = 0, lastScene = '', lastCount = -1;
function digits(str, h, top, word) {
  const d = $('digits'); d.style.top = top + 'px'; d.style.height = h + 'px';
  let html = word ? `<span class="word" style="font-size:${h * 0.9}px">${word}</span>` : '';
  for (const ch of str) { const n = ch === '/' ? 'slash' : ch === '명' ? 'myeong' : ch; html += `<img src="assets/cd_${n}.webp" style="height:${ch === '/' ? h * 1.02 : h}px" alt="${ch}">`; }
  d.innerHTML = html;
}
function scene(name) {
  if (name === lastScene) return; lastScene = name;
  ['count', 'fill', 'celebrate', 'url', 'online', 'joinFix'].forEach(id => $(id).classList.add('hidden'));
  $('digits').innerHTML = '';
  const bgs = { waiting: `board_join${[1, 2, 3].includes(B.unit) ? B.unit : 1}`, countdown: 'board_countdown', playing: 'board_progress', finished: 'board_finished', ended: 'board_end' };
  $('bg').src = `assets/${bgs[name]}.webp`;
}
function render() {
  if (!B) return;
  let ph = B.phase;
  if (ph === 'countdown' && countEnd - performance.now() <= 0) ph = 'playing';
  if (ph === 'playing' && B.size > 0 && B.done >= B.size) ph = 'finished';
  scene(ph);
  if (ph === 'waiting') { $('joinFix').classList.remove('hidden'); $('url').classList.remove('hidden'); $('online').classList.remove('hidden'); $('online').textContent = `들어온 학생 ${B.online}명`; }
  if (ph === 'countdown') { const n = Math.min(3, Math.max(1, Math.ceil((countEnd - performance.now()) / 1000))); if (n !== lastCount) { lastCount = n; const c = $('count'); c.src = `assets/cd_${n}.webp`; c.classList.remove('hidden', 'pop'); void c.offsetWidth; c.classList.add('pop'); } }
  if (ph === 'playing') { digits(`${B.done}/${B.size}명`, 210, 300); const f = $('fill'); f.classList.remove('hidden'); f.style.width = (Math.min(1, B.done / Math.max(1, B.size)) * 1329) + 'px'; }
  if (ph === 'finished') { digits(`${B.done}/${B.size}명`, 170, 360); $('celebrate').classList.remove('hidden'); }
  if (ph === 'ended') digits(`${B.done}/${B.size}명`, 200, 330, '완주');
}
async function poll() {
  try {
    const r = await fetch(`api/board?cls=${cls}`, { cache: 'no-store' }); if (!r.ok) throw 0;
    const j = await r.json();
    if (j.phase === 'countdown' && (!B || B.phase !== 'countdown')) { countEnd = performance.now() + j.countdownLeft; lastCount = -1; }
    if (B && j.unit !== B.unit && lastScene === 'waiting') lastScene = '';
    B = j; $('err').classList.add('hidden'); render();
  } catch (e) { $('err').classList.remove('hidden'); }
}
poll(); setInterval(poll, 1000); setInterval(render, 100);
</script>
</body>
</html>
